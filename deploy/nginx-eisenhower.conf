# The nginx location of the Eisenhower Matrix web app.
#
# The site is served by the systemd unit eisenhower-matrix-web on
# 127.0.0.1:8792. This block is added inside the server block of
# thibautfontaine.space; no other site is touched.
#
# The trailing slash on proxy_pass makes the application receive the paths
# without the /eisenhower prefix, so the relative paths of the pages
# (core/app.js, app.css) resolve the same way as on the root of a site.

location = /eisenhower {
    return 301 /eisenhower/;
}

location /eisenhower/ {
    proxy_pass http://127.0.0.1:8792/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
